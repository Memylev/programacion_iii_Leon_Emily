<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones CSS - ClickLab</title>
    <link rel="stylesheet" href="18_transsiciones_mp_emily_leon.css">
</head>
<body>
    <main>
        <h1>Enfoque del Estudio ClickLab</h1>
        <div class="espacio2">
            <div class="camara2">Canon R50</div>
        </div>

        <h1>ClickLab Studio</h1>
        <p>Coloca el cursor sobre el botón</p>
        <button class="boton-clicklab">
            Ver catálogo ClickLab
        </button>

        <div class="tarjeta">
            <h2>Pentax K1000</h2>
            <p>Cámara Retro 35mm</p>
        </div>

        <div class="alerta">
            Stock bajo de baterías
        </div>

        <br><br>

        <h1>Vitrina ClickLab</h1>
        <div class="vitrina">
            <div class="camara">Lente 50mm</div>
        </div>

        <h1>Obturador ClickLab</h1>
        <div class="obturador">
            <div class="indicador">📷</div>
        </div>

        <h1>Estante Digital</h1>
        <div class="vitrina2">
            <div class="camara3">Sony a6400</div>
        </div>

        <h1>Desplazamiento de Carril</h1>
        <div class="espacio">
            <div class="camara-animada">Trípode Pro</div>
        </div>
    </main>
</body>
</html>
