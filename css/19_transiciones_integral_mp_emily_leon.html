<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio Fotográfico ClickLab Animado</title>
    <link rel="stylesheet" href="19_transiciones_integral_mp_emily_leon.css">
</head>
<body>
    <header>
        <h1>Estudio ClickLab</h1>
        <p>Simulación de sesión fotográfica e iluminación en tiempo real.</p>
    </header>

    <main>
        <section class="escena" aria-label="Escena de estudio fotográfico animado">
            <div class="destello destello1"></div>
            <div class="destello destello2"></div>
            <div class="destello destello3"></div>
            <div class="destello destello4"></div>
            <div class="destello destello5"></div>

            <div class="camara-dron">
                <span aria-hidden="true">📷</span>
                <p>ClickLab Cam</p>
            </div>

            <div class="alerta">
                SESIÓN EN VIVO
            </div>
        </section>

        <section class="controles">
            <h2>Panel de Control ClickLab</h2>
            <div class="panel">
                <article class="sensor-contenedor">
                    <h3>Sensor de Enfoque</h3>
                    <div class="sensor" aria-hidden="true">
                        <div class="pulso"></div>
                        <div class="centro"></div>
                    </div>
                </article>

                <article class="estado">
                    <h3>Estado del Estudio</h3>
                    <p>Sesión fotográfica activa.</p>
                    <p>Equipo: Canon EOS R50 + 50mm</p>
                    <p>Tienda: ClickLab - Emily Leon</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>ClickLab Studio - 2026</p>
    </footer>
</body>
</html>
