<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección DOM - ClickLab</title>
    <script src="02_seleccion_mp_emily_leon.js" defer></script>
</head>
<body>
    <h1>Inventario ClickLab</h1>
    <p id="stock">Stock: 0</p>
    <p id="linea">Línea: Sin definir</p>
    <p id="estado">Estado: Cerrado</p>

    <h1>Selección con class</h1>
    <p class="equipo">Canon EOS R50</p>
    <p class="equipo">Pentax K1000</p>
    <p class="equipo">Nikon Z30</p>

    <h2>Pendiente</h2>
    <h3 id="estudio">Pendiente</h3>

    <div id="kit">
        <p class="estado">En preparación</p>
    </div>

    <h1>Accesorios ClickLab</h1>
    <p class="accesorios">Lente 50mm</p>
    <p class="accesorios">Trípode Pro</p>
    <p class="accesorios">Batería Li-ion</p>
    <p class="accesorios">Tarjeta SD 128GB</p>
    <p class="accesorios">Correa Retro</p>
    <p class="accesorios">Filtro UV</p>
</body>
</html>
