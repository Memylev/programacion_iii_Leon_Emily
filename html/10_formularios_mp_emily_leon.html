<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios - ClickLab</title>
</head>
<body>
    <h1>Registro de Clientes - ClickLab</h1>
    <form action="/registro" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Emily">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="apellido">Apellido:</label><br>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej: Leon">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="confirm_password">Confirmar Contraseña:</label><br>
                    <input type="password" id="confirm_password" name="confirm_password">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad:</label><br>
                    <input type="number" id="edad" name="edad">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="resolucion">Resolución preferida (MP):</label><br>
                    <input type="number" id="resolucion" name="resolucion" min="12" max="100">
                </td>
                <td>
                    <label for="presupuesto">Nivel de presupuesto:</label><br>
                    <input
                        type="number"
                        id="presupuesto"
                        name="presupuesto"
                        min="0"
                        max="100"
                        value="50"
                        step="5"
                    >
                </td>
            </tr>
            <tr>
                <td>
                    <p>Estilo de fotografía:</p>
                    <input type="radio" id="retro" name="estilo" value="retro">
                    <label for="retro">Analógica / Retro</label><br>
                    <input type="radio" id="digital" name="estilo" value="digital">
                    <label for="digital">Digital / Moderna</label>
                </td>
                <td>
                    <label>Accesorios de interés:</label><br>
                    <input type="checkbox" id="lentes" name="accesorios" value="lentes">
                    <label for="lentes">Lentes 50mm</label><br>
                    <input type="checkbox" id="tripode" name="accesorios" value="tripode">
                    <label for="tripode">Trípode</label><br>
                    <input type="checkbox" id="baterias" name="accesorios" value="baterias">
                    <label for="baterias">Baterías Li-ion</label><br>
                    <input type="checkbox" id="memorias" name="accesorios" value="memorias">
                    <label for="memorias">Tarjetas SD</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="marca">Marca favorita:</label><br>
                    <select id="marca" name="marca">
                        <option value="canon">Canon</option>
                        <option value="nikon">Nikon</option>
                        <option value="sony">Sony</option>
                        <option value="fujifilm">Fujifilm</option>
                    </select>
                </td>
                <td>
                    <label for="kit">Kit recomendado:</label><br>
                    <select id="kit" name="kit" multiple size="3">
                        <option value="" selected>Seleccione componentes</option>
                        <option value="camara">Cámara cuerpo</option>
                        <option value="lente">Lente kit</option>
                        <option value="estuche">Estuche ClickLab</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <fieldset>
                        <legend>Datos Generales ClickLab:</legend>
                        <label for="sucursal">Sucursal principal: Quito</label><br>
                    </fieldset>
                </td>
            </tr>
        </table>

        <button type="submit">Enviar</button>
        <button type="reset">Resetear</button>
    </form>
</body>
</html>
