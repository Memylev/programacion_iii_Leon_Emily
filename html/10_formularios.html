<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>

<body>
    <form action="/registro" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Luke">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="apellido">Apellido:</label><br>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej: Skywalker">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="confirm_password">Confirmar Contraseña:</label><br>
                    <input type="password" id="confirm_password" name="confirm_password">
                </td>
            </tr>
              <tr>
                <td>
                    <label for="edad">Edad:</label><br>
                    <input type="number" id="edad" name="edad">
                </td>
            </tr>
              <tr>
                <td>
                    <label for="nivel_fuerza">Nivel de Fuerza:</label><br>
                    <input type="number" id="nivel_fuerza" name="nivel_fuerza" min="0" max="100">
                </td>
                <td>
                    <label for="nivel">Nivel de Fuerza:</label><br>
                    <input
                        type="number" 
                        id="nivel" 
                        name="nivel" 
                        min="0" 
                        max="100"
                        value="50"
                        step="5"
                    >
                </td>
            </tr>
            <tr>
                    <td>
                        <p>Seleccione tu bando:</p>
                        <input type="radio" id="rebelde" name="bando" value="rebelde">
                        <label for="rebelde">Jedi</label><br>
                        <input type="radio" id="imperial" name="bando" value="imperial">
                        <label for="imperial">Sith</label>
                    </td>
                    <td>
                        <label for="nivel">Nivel tus habilidades:</label><br>
                        <input 
                            type="checkbox" 
                            id="fuerza" 
                            name="habilidades" 
                            value="sable" 
                        >
                        <label for="fuerza">Uso de Fuerza</label><br>
                        <input 
                            type="checkbox" 
                            id="sables" 
                            name="habilidades" 
                            value="sables" 
                        >
                        <label for="sables">Sables de Luz</label><br>
                        <input 
                            type="checkbox" 
                            id="levitar" 
                            name="habilidades" 
                            value="levitar" 
                        >
                        <label for="levitar">Levitar Objetos</label><br>
                        <input 
                            type="checkbox" 
                            id="oscuridad" 
                            name="habilidades" 
                            value="oscuridad" 
                        >
                        <label for="levitar">levitar</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="edad">Planeta de Origen:</label><br>
                        <select id="planeta" name="planeta">
                            <option value="tatooine">Tatooine</option>
                            <option value="alderaan">Alderaan</option>
                            <option value="naboo">Naboo</option>
                            <option value="coruscant">Coruscant</option>
                        </select>
                    </td>
                    <td>
                        <label for="edad">Droide:</label><br>
                        <select id="droide" name="droide" multiple="2">
                            <option Value="" selected>Seleccione un droide</option>
                            <option value="r2d2">R2-D2</option>
                            <option value="c3po">C-3PO</option>
                            <option value="ig88">IG-88</option>
                        </select>
                    </td>
                </tr>
            </table>

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
