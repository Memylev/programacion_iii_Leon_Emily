<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de pedidos - ClickLab</title>
</head>
<body>
    <header>
        <h1>Centro de Pedidos y Mantenimiento ClickLab</h1>
        <p>Registro de órdenes de fotografía</p>
    </header>
    <hr>
    <main>
        <form action="#" method="get" id="registro-clicklab">
            <fieldset>
                <legend>Información del pedido</legend>
                <label for="codigo">Código de orden:</label>
                <input type="text" id="codigo" name="codigo" placeholder="CLK-001" maxlength="10" required>
                <br><br>
                <label for="responsable">Asesor encargado:</label>
                <select id="responsable" name="responsable" required>
                    <option value="">Selecciona un asesor</option>
                    <option value="emily">Emily Leon</option>
                    <option value="memy">Memy Leon</option>
                    <option value="soporte">Técnico ClickLab</option>
                </select>
                <br><br>
                <label for="equipo">Equipo solicitado:</label>
                <input type="text" id="equipo" name="equipo" placeholder="Ej. Canon EOS R50" required>
                <br><br>
                <label for="fecha">Fecha de entrega:</label>
                <input type="date" id="fecha" name="fecha" required>
            </fieldset>
            <br>
            <fieldset>
                <legend>Características</legend>
                <p>Prioridad del pedido:</p>
                <input type="radio" id="alta" name="prioridad" value="alta" required>
                <label for="alta">Alta</label>
                <input type="radio" id="media" name="prioridad" value="media">
                <label for="media">Media</label>
                <input type="radio" id="baja" name="prioridad" value="baja">
                <label for="baja">Baja</label>
                <br><br>
                <label for="cantidad">Cantidad de unidades (1 a 10):</label>
                <input type="number" id="cantidad" name="cantidad" min="1" max="10" value="1">
                <p>Accesorios incluidos:</p>
                <input type="checkbox" id="lente" name="accesorios" value="lente">
                <label for="lente">Lente 50mm</label>
                <br>
                <input type="checkbox" id="tripode" name="accesorios" value="tripode">
                <label for="tripode">Trípode</label>
                <br>
                <input type="checkbox" id="bateria" name="accesorios" value="bateria">
                <label for="bateria">Batería extra Li-ion</label>
            </fieldset>
            <br>
            <fieldset>
                <legend>Observaciones del cliente</legend>
                <label for="descripcion">Detalles del pedido:</label>
                <br>
                <textarea id="descripcion" name="descripcion" rows="5" cols="45" maxlength="500" placeholder="Describe las especificaciones del equipo o servicio..." required></textarea>
            </fieldset>
            <br>
            <button type="submit">Registrar pedido</button>
            <button type="reset">Limpiar datos</button>
        </form>
    </main>
    <hr>
    <footer>
        <p><small>ClickLab - Emily Leon - 2026</small></p>
    </footer>
</body>
</html>
